<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">WIMS — from campus camera to available-space dashboard</title>
<desc id="desc">An isometric technical illustration showing a campus study area observed by a camera, a laptop running people detection, an occupancy engine, and a live dashboard that helps students find available seats. Only counts and occupancy metadata are stored, not raw video.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#67e8f9"/></marker>
</defs>
<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<g opacity=".12" stroke="#93c5fd" stroke-width="1"><path d="M0 100H1200M0 180H1200M0 260H1200M0 340H1200M0 420H1200M0 500H1200M0 580H1200"/><path d="M100 0V640M200 0V640M300 0V640M400 0V640M500 0V640M600 0V640M700 0V640M800 0V640M900 0V640M1000 0V640M1100 0V640"/></g>
